name: Release

# On every push to main: run CI (Biome + build + cargo test/clippy) and ONLY if
# it passes, bump the patch version, tag, build the Windows installer, and
# publish a GitHub Release with signed updater artifacts (latest.json). PRs run
# CI only. The release job skips the bot's own bump commit (`chore(release):`).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: ci (lint · build · test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint + format (Biome)
        run: bun run lint

      - name: Build app (typecheck + Vite)
        run: bun run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rustfmt
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Clippy (warnings = errors)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Cargo test
        run: cargo test
        working-directory: src-tauri

  release:
    name: bump · build · publish
    runs-on: windows-latest
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release):')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          current=$(jq -r .version src-tauri/tauri.conf.json)
          IFS=. read -r major minor patch <<< "$current"
          next="${major}.${minor}.$((patch + 1))"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          tmp=$(mktemp)
          jq --arg v "$next" '.version = $v' src-tauri/tauri.conf.json > "$tmp"
          mv "$tmp" src-tauri/tauri.conf.json
          sed -i -E "0,/^version = \".*\"$/ s//version = \"$next\"/" src-tauri/Cargo.toml
          tmp=$(mktemp)
          jq --arg v "$next" '.version = $v' package.json > "$tmp"
          mv "$tmp" package.json
          echo "bumped $current -> $next"

      - name: Commit, tag, push
        shell: bash
        run: |
          set -euo pipefail
          next="${{ steps.bump.outputs.next }}"
          git add src-tauri/tauri.conf.json src-tauri/Cargo.toml package.json
          git commit -m "chore(release): v${next} [skip ci]"
          git tag "v${next}"
          git push origin main
          git push origin "v${next}"

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build & publish installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the build + emits latest.json so the in-app updater can verify updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v${{ steps.bump.outputs.next }}
          releaseName: 'Mask v${{ steps.bump.outputs.next }}'
          releaseBody: |
            Auto-released from `main` @ ${{ github.sha }}.

            Download the installer (`.exe` NSIS or `.msi`) for Windows and run it.
            To route your voice into calls, install a virtual cable (VB-Cable) —
            the app guides you through it on first launch.

            > **First install:** Mask is unsigned, so Windows SmartScreen may warn
            > "Unrecognized app". Click **More info → Run anyway**.
          releaseDraft: false
          prerelease: false
