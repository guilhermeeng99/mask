[package]
name = "mask"
version = "0.1.0"
description = "Real-time voice changer for Windows"
authors = ["Guilherme <guilhermeeng99@gmail.com>"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mask_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18.1"
ringbuf = "0.5.0"
thiserror = "2.0.18"
uuid = { version = "1.23.3", features = ["v4"] }
signalsmith-stretch = "0.1.3"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-single-instance = "2.4.2"
parking_lot = "0.12.5"
symphonia = { version = "0.5", features = ["mp3", "wav", "ogg", "vorbis", "flac", "isomp4", "aac"] }
tauri-plugin-opener = "2.5.4"
# AI voice conversion (phase 2): ONNX Runtime with DirectML default and CUDA
# opt-in (ai_voice_conversion rule 1).
ort = { version = "2.0.0-rc.10", features = ["directml", "cuda"] }
ureq = "2"
sha2 = "0.10"
rustfft = "6.4.1"
